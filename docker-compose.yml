version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: taskforge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
    ports:
      - "5432:5432"
    volumes:
      - taskforge_db_data:/var/lib/postgresql/data

volumes:
  taskforge_db_data:
